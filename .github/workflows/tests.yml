name: Synthetic ledger tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  native-selection:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/test-date-range.sh
      - run: bash scripts/test-trend-scale.sh
      - run: bash scripts/test-window-placement.sh
  ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -B -m unittest discover -s tests -v

  windows-preview:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -B tests/windows_smoke.py
      - run: python -B -m unittest discover -s tests -p test_bill.py -v
